name: CI

# Se ejecuta en cada Pull Request y en cada push a las ramas principales.
# Los trabajos de backend y frontend se saltan solos mientras esas carpetas no existan.
on:
  pull_request:
    branches: [main, recuperacion/olaya]
  push:
    branches: [main, recuperacion/olaya]

jobs:
  arnes:
    name: Pruebas de los hooks del arnés
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hooks
        run: node --test .claude/hooks/hooks.test.mjs

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    # Base PostgreSQL 16 desechable para las pruebas (spec 001, research D1).
    # La clave no es un secreto: la base nace vacía y se destruye al terminar el job.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: turismo
          POSTGRES_PASSWORD: turismo_ci
          POSTGRES_DB: turismo_pruebas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U turismo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_PRUEBAS: postgresql+psycopg://turismo:turismo_ci@localhost:5432/turismo_pruebas
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar si existe el backend
        id: existe
        run: if [ -f backend/requirements.txt ]; then echo "si=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.existe.outputs.si == 'true'
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        if: steps.existe.outputs.si == 'true'
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Pruebas
        if: steps.existe.outputs.si == 'true'
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar si existe el frontend
        id: existe
        run: if [ -f frontend/package-lock.json ]; then echo "si=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.existe.outputs.si == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        if: steps.existe.outputs.si == 'true'
        working-directory: frontend
        run: npm ci
      - name: Pruebas
        if: steps.existe.outputs.si == 'true'
        working-directory: frontend
        run: npx ng test --watch=false
      - name: Compilar
        if: steps.existe.outputs.si == 'true'
        working-directory: frontend
        run: npm run build
